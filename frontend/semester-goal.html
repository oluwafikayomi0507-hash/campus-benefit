<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Semester Goals | Campus Benefit</title>

    <link rel="stylesheet" href="css/semester-goal.css">
</head>

<body>

    <main class="goals-page">

        <a href="index.html" class="back-link">
            ← Back to Campus Benefit
        </a>

        <div class="goals-heading">

            <span>ACADEMIC TOOL</span>

            <h1>Semester Goals</h1>

            <p>
                Set your academic goals, track your progress and stay focused throughout the semester.
            </p>

        </div>


        <section class="goals-card">

            <div class="goals-header">

                <div>
                    <h2>My Semester Goals</h2>

                    <p>
                        What do you want to achieve this semester?
                    </p>
                </div>

                <button class="add-goal">
                    + Add Goal
                </button>

            </div>


            <p id="goals-sync-status" role="status" aria-live="polite"></p>
            <div class="goals-list">

                <div class="empty-goals">
                    <span>🎯</span>

                    <h3>No goals yet</h3>

                    <p>
                        Add your first semester goal and start working towards it.
                    </p>
                </div>

            </div>

        </section>

    </main>

    <script src="js/semester-goal.js"></script>

  <script src="js/auth-guard.js"></script>
</body>

</html>
