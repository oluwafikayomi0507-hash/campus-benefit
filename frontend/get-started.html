<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Get Started | Campus Benefit</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/get-started.css">
</head>

<body>

    <main class="welcome-page">

        <a href="index.html" class="back-home">
            ← Back to Campus Benefit
        </a>

        <section class="welcome-container">

            <div class="logo-area">
                <img src="img/logo-symbol.png" alt="Campus Benefit logo">
                <span>Campus Benefit</span>
            </div>

            <div class="welcome-content">

                <span class="welcome-badge">
                    BUILT FOR NIGERIAN STUDENTS
                </span>

                <h1>
                    Welcome to
                    <span>Campus Benefit.</span>
                </h1>

                <p>
                    Your campus. Your opportunities.
                    Your tools. Your community.
                </p>

                <div class="welcome-actions">

                    <a href="signup.html" class="primary-button">
                        Create an Account
                        <span>→</span>
                    </a>

                    <a href="login.html" class="secondary-button">
                        Log In
                    </a>

                </div>

                <p class="existing-user">
                    Already have an account?
                    <a href="login.html">Log in here</a>
                </p>

            </div>

        </section>

        <p class="bottom-text">
            © 2026 Campus Benefit. Built for Nigerian students.
        </p>

    </main>

  <script src="js/auth-guard.js"></script>
</body>

</html>
