<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Course Planner | Campus Benefit</title>

    <link rel="stylesheet" href="css/planner.css">
</head>

<body>

    <main class="planner-page">

        <a href="index.html" class="back-link">
            ← Back to Campus Benefit
        </a>

        <div class="planner-heading">
            <span>ACADEMIC TOOL</span>
            <h1>Course Planner</h1>
            <p>Plan your study schedule and stay on track with your courses.</p>
        </div>

        <div class="planner-card">

            <div class="planner-header">
                <div>
                    <h2>My Reading Calendar</h2>
                    <p>Organize what you want to study each day.</p>
                </div>

                <div class="planner-actions">

                     <button type="button" class="add-study">
                        + Add Study Session
                    </button>

                    <button type="button" class="clear-schedule">
                        Clear All
                    </button>

                </div>

            </div>

            <div class="calendar">
                <div class="day">
                    <h3>Monday</h3>
                </div>

                <div class="day">
                    <h3>Tuesday</h3>
                </div>

                <div class="day">
                    <h3>Wednesday</h3>
                </div>

                <div class="day">
                    <h3>Thursday</h3>
                </div>

                <div class="day">
                    <h3>Friday</h3>
                </div>

                <div class="day">
                    <h3>Saturday</h3>
                </div>

                <div class="day">
                    <h3>Sunday</h3>
                </div>

            </div>

        </div>

    </main>

    <script src="js/planner.js"></script>

</body>

</html>
