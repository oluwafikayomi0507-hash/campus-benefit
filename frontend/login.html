<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Log In | Campus Benefit</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <main class="login-page">

        <a href="get-started.html" class="back-home">
            ← Back
        </a>

        <section class="login-container">

            <!-- Logo -->
            <div class="logo-area">
                <img src="img/logo-symbol.png" alt="Campus Benefit logo">
                <span>Campus Benefit</span>
            </div>


            <!-- Heading -->
            <div class="login-heading">
                <h1>Welcome back</h1>

                <p>
                    Log in to continue your Campus Benefit journey.
                </p>
            </div>


            <!-- Login Form -->
            <form class="login-form">

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email address"
                        required>

                </div>


                <div class="form-group">

                    <div class="password-label">
                        <label for="password">
                            Password
                        </label>

                        <a href="#">
                            Forgot password?
                        </a>
                    </div>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required>

                </div>


                <button type="submit" class="login-button">
                    Log In
                </button>

            </form>


            <!-- Sign up -->
            <p class="signup-text">
                Don't have an account?
                <a href="signup.html">Create an account</a>
            </p>

        </section>


        <p class="bottom-text">
            © 2026 Campus Benefit. Built for Nigerian students.
        </p>

    </main>

</body>

</html>
